name: Verify final Full Harness review fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.pull_request.head.sha, 'never') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lyndon/full-harness-fixes
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply review corrections
        run: python3 .github/apply_review_fixes.py

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if [ -f launcher/bun.lock ] || [ -f launcher/bun.lockb ]; then
            (cd launcher && bun install --frozen-lockfile)
          fi

      - name: Verify project
        run: bun run verify

      - name: Commit verified review corrections
        run: |
          rm -f .github/apply_review_fixes.py .github/workflows/apply-review-fixes.yml
          git config user.name "Lyndon Full Harness CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Full Harness regression coverage [reviewed-fixes]"
          git push origin HEAD:lyndon/full-harness-fixes
