name: Apply tools-menu connector resume fix

on:
  push:
    branches:
      - lyndon/tools-menu-connector-resume

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes
        run: |
          python3 .github/scripts/apply-tools-menu-connector.py
          python3 .github/scripts/remove-redundant-connector-reset.py
          python3 .github/scripts/update-tools-menu-test-mocks.py
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused regression
        run: bun test tests/tools-menu-connector.test.ts tests/browser-worker-contract.test.ts tests/persistent-session.test.ts
      - name: Full verification
        run: bun run verify
      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapters/chatgpt-web/browser-worker.ts src/adapters/chatgpt-web/prompt.ts tests/browser-worker-contract.test.ts tests/tools-menu-connector.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Select persistent connector through tools menu'
          git push
