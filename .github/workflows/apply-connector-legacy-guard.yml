name: Apply connector legacy guard fix

on:
  push:
    branches: [lyndon/github-first-web-apps]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap connector legacy guard fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lyndon/github-first-web-apps
      - run: python3 scripts/fix-connector-legacy-guard.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web/browser-worker.ts
          git commit -m "Preserve connector migration guard"
          git push origin HEAD:lyndon/github-first-web-apps
