  expect(adapterSource).toContain("await chatGptTurnSessions.retireAndWait(activeBrowserExecution.key);");
});
'''
              persistent_path.write_text(persistent)

          for path in [
              "src/adapters/chatgpt-web/turn-execution.ts",
              "src/adapters/chatgpt-web/index.ts",
