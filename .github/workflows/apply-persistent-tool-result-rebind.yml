name: Apply persistent tool-result rebind fix

on:
  push:
    branches:
      - lyndon/serialize-persistent-browser-executions
    paths:
      - .github/workflows/apply-persistent-tool-result-rebind.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: |
          python3 .github/scripts/apply-persistent-tool-result-rebind.py
          git diff --check

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if [[ -f launcher/bun.lock || -f launcher/bun.lockb ]]; then
            (cd launcher && bun install --frozen-lockfile)
          fi

      - name: Focused regression
        run: bun test tests/persistent-tool-result-rebind.test.ts tests/persistent-session.test.ts

      - name: Full verification
        run: bun run verify

      - name: Commit verified source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web/turn-execution.ts src/adapters/chatgpt-web/index.ts
          git commit -m "Rebind persistent Web tool-result rounds"
          git push origin HEAD:lyndon/serialize-persistent-browser-executions
