name: Apply persistent tool-result rebind fix

on:
  push:
    branches:
      - lyndon/serialize-persistent-browser-executions
    paths:
      - .github/workflows/apply-persistent-tool-result-rebind.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source and regression changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match in {path}, got {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/adapters/chatgpt-web/turn-execution.ts",
              '''  constructor(readonly runtime: ChatGptTurnRuntime) {
''',
              '''  constructor(readonly runtime: ChatGptTurnRuntime, readonly browserSessionId?: string) {
''',
              "session browser identity",
          )

          replace_once(
              "src/adapters/chatgpt-web/turn-execution.ts",
              '''  getOrCreate(key: string, start: () => ChatGptTurnRuntime): ChatGptTurnSession {
    this.prune();
    const existing = this.entries.get(key);
    if (existing) {
      existing.touch();
      return existing;
    }
    const active = [...this.entries.values()].filter(session => session.isActive()).length;
    if (active >= MAX_CHATGPT_BROWSER_TABS) {
      throw new Error(
        `ChatGPT Web supports at most ${MAX_CHATGPT_BROWSER_TABS} simultaneous browser turns; close or finish a browser tab before starting another`,
      );
    }
    if (this.entries.size >= this.maxEntries) throw new Error(`ChatGPT web session registry is full (${this.maxEntries} entries)`);
    const session = new ChatGptTurnSession(start());
    this.entries.set(key, session);
    return session;
  }

  async waitForRetirement(key: string): Promise<void> {
''',
              '''  getOrCreate(
    key: string,
    start: () => ChatGptTurnRuntime,
    browserSessionId?: string,
  ): ChatGptTurnSession {
    this.prune();
    const existing = this.entries.get(key);
    if (existing) {
      existing.touch();
      return existing;
    }
    const active = [...this.entries.values()].filter(session => session.isActive()).length;
    if (active >= MAX_CHATGPT_BROWSER_TABS) {
      throw new Error(
        `ChatGPT Web supports at most ${MAX_CHATGPT_BROWSER_TABS} simultaneous browser turns; close or finish a browser tab before starting another`,
      );
    }
    if (this.entries.size >= this.maxEntries) throw new Error(`ChatGPT web session registry is full (${this.maxEntries} entries)`);
    const session = new ChatGptTurnSession(start(), browserSessionId);
    this.entries.set(key, session);
    return session;
  }

  activeForBrowserSession(browserSessionId: string): { key: string; session: ChatGptTurnSession } | undefined {
    this.prune();
    let active: { key: string; session: ChatGptTurnSession } | undefined;
    for (const [key, session] of this.entries) {
      if (session.browserSessionId !== browserSessionId || !session.isActive()) continue;
      if (active) {
        throw new Error(`ChatGPT browser session ${browserSessionId} has multiple active executions`);
      }
      active = { key, session };
    }
    return active;
  }

  async waitForRetirement(key: string): Promise<void> {
''',
              "registry browser-session ownership",
          )

          replace_once(
              "src/adapters/chatgpt-web/index.ts",
              '''      const executionKey = `${executionNamespace}:${chatGptTurnExecutionKey(parsed)}`;
      await chatGptTurnSessions.waitForRetirement(executionKey);
      const traceId = createHash("sha256").update(executionKey).digest("hex").slice(0, 12);
      const persistentSessionId = browserSessionId(parsed);
      const session = chatGptTurnSessions.getOrCreate(
        executionKey,
        () => startRuntime(parsed, environment, traceId, turnCapabilities, persistentSessionId),
      );
''',
              '''      let executionKey = `${executionNamespace}:${chatGptTurnExecutionKey(parsed)}`;
      const persistentSessionId = browserSessionId(parsed);
      if (!parsed._compactionRequest && persistentSessionId) {
        const activeBrowserExecution = chatGptTurnSessions.activeForBrowserSession(persistentSessionId);
        if (activeBrowserExecution && activeBrowserExecution.key !== executionKey) {
          const matchingToolResults = currentToolResults(parsed, activeBrowserExecution.session);
          if (activeBrowserExecution.session.outstanding().length > 0 && matchingToolResults.length > 0) {
            console.warn(
              `[chatgpt-web] rebound changed-key tool-result round to active browser execution `
              + `(browser_session=${persistentSessionId}, matching_results=${matchingToolResults.length})`,
            );
            executionKey = activeBrowserExecution.key;
          } else {
            await chatGptTurnSessions.retireAndWait(activeBrowserExecution.key);
          }
        }
      }
      await chatGptTurnSessions.waitForRetirement(executionKey);
      const traceId = createHash("sha256").update(executionKey).digest("hex").slice(0, 12);
      const session = chatGptTurnSessions.getOrCreate(
        executionKey,
        () => startRuntime(parsed, environment, traceId, turnCapabilities, persistentSessionId),
        persistentSessionId,
      );
''',
              "persistent browser execution rebind",
          )

          test_path = Path("tests/chatgpt-web-harness.test.ts")
          tests = test_path.read_text()
          marker = 'test("rebinds changed-key tool-result rounds to the active persistent browser execution"'
          if marker not in tests:
              insertion = r'''
  test("rebinds changed-key tool-result rounds to the active persistent browser execution", async () => {
    const socketPath = brokerTestEndpoint(`cgw-h3-persistent-tool-result-${process.pid}-${Date.now()}`);
    const provider: CodexProviderConfig = {
      adapter: "chatgpt-web",
      baseUrl: "browser://chatgpt-persistent-tool-result-test",
      chatgptWeb: { brokerSocketPath: socketPath, turnTimeoutMs: 30_000, localToolsEnabled: true, proAvailable: true },
    };
    const worker = ChatGptBrowserWorker.forProvider(provider);
    const originalRun = worker.run.bind(worker);
    let browserStarts = 0;
    (worker as unknown as { run: (turn: BrowserTurn) => Promise<string> }).run = async turn => {
      browserStarts += 1;
      if (browserStarts > 1) throw new Error("duplicate persistent browser runtime started");
      const prepared = await turn.prepare();
      try {
        const token = prepared.text.match(/turn_token (turn_[A-Za-z0-9_-]+)/)?.[1];
        if (!token) throw new Error("turn token missing from compiled prompt");
        const claimed = await callTurnBroker<{ bindingId: string }>(socketPath, { method: "claim", token });
        const nativeResult = await callTurnBroker<BrokerToolResult>(socketPath, {
          method: "invoke",
          bindingId: claimed.bindingId,
          wireName: "write_stdin",
          freeform: false,
          arguments: { session_id: 42, chars: "" },
        }, 30_000);
        const output = (nativeResult.structuredContent as { output: string }).output;
        const answer = `Tool result resumed: ${output}`;
        turn.onTextDelta(answer);
        return answer;
      } finally {
        prepared.release();
      }
    };

    const adapter = createChatGptWebAdapter(provider);
    const firstRequest = rawWireRequest(environmentXml);
    const firstEvents: AdapterEvent[] = [];
    try {
      await adapter.runTurn!(firstRequest, { headers: new Headers() }, event => firstEvents.push(event));
      expect(browserStarts).toBe(1);
      const callStart = firstEvents.find(
        (event): event is Extract<AdapterEvent, { type: "tool_call_start" }> => event.type === "tool_call_start",
      );
      expect(callStart?.name).toBe("write_stdin");
      expect(firstEvents.at(-1)).toMatchObject({ type: "done", stopReason: "tool_use", endTurn: false });

      const resultRequest = structuredClone(firstRequest);
      const changedTurnId = "turn_test_tool_result_456";
      const raw = resultRequest._rawBody as {
        client_metadata: Record<string, unknown>;
        input: Array<Record<string, unknown>>;
      };
      raw.client_metadata["x-codex-turn-metadata"] = JSON.stringify({
        thread_id: "thread_test_123",
        turn_id: changedTurnId,
      });
      for (const item of raw.input) {
        if (item.type !== "message" || item.role !== "user") continue;
        item.internal_chat_message_metadata_passthrough = { turn_id: changedTurnId };
      }

      const toolCall = {
        role: "assistant" as const,
        content: [{
          type: "toolCall" as const,
          id: callStart!.id,
          name: "write_stdin",
          arguments: { session_id: 42, chars: "" },
        }],
        timestamp: 3,
      };
      const result = {
        role: "toolResult" as const,
        toolCallId: callStart!.id,
        toolName: "write_stdin",
        content: JSON.stringify({ output: "command complete", exit_code: 0 }),
        isError: false,
        timestamp: 4,
      };
      resultRequest.context.messages.push(toolCall, result);
      raw.input.push(
        {
          type: "function_call",
          call_id: callStart!.id,
          name: "write_stdin",
          arguments: JSON.stringify({ session_id: 42, chars: "" }),
        },
        {
          type: "function_call_output",
          call_id: callStart!.id,
          output: result.content,
        },
      );

      expect(chatGptTurnExecutionKey(resultRequest)).not.toBe(chatGptTurnExecutionKey(firstRequest));

      const resultEvents: AdapterEvent[] = [];
      await adapter.runTurn!(resultRequest, { headers: new Headers() }, event => resultEvents.push(event));

      expect(browserStarts).toBe(1);
      expect(resultEvents.filter(
        (event): event is Extract<AdapterEvent, { type: "text_delta" }> => event.type === "text_delta",
      ).map(event => event.text).join("")).toBe("Tool result resumed: command complete");
      expect(resultEvents.at(-1)).toMatchObject({ type: "done", stopReason: "stop", endTurn: true });
    } finally {
      (worker as unknown as { run: (turn: BrowserTurn) => Promise<string> }).run = originalRun;
      await TurnBroker.forSocket(socketPath).close();
    }
  });
'''
              pos = tests.rfind("\n});")
              if pos < 0:
                  raise SystemExit("could not find harness describe terminator")
              tests = tests[:pos] + "\n" + insertion + tests[pos:]
              test_path.write_text(tests)

          persistent_path = Path("tests/persistent-session.test.ts")
          persistent = persistent_path.read_text()
          marker2 = 'test("adapter rebinds matching tool-result rounds before claiming a new persistent browser execution"'
          if marker2 not in persistent:
              persistent += r'''

test("adapter rebinds matching tool-result rounds before claiming a new persistent browser execution", () => {
  const adapterSource = readFileSync(
