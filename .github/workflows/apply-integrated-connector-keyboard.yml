name: Apply integrated connector keyboard fix

on:
  push:
    branches: [lyndon/integrate-connector-keyboard-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Integrate connector keyboard selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lyndon/integrate-connector-keyboard-fix
      - name: Apply guarded source edits
        run: python3 scripts/apply-integrated-connector-keyboard.py
      - name: Commit source changes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate connector keyboard selection'
          git push origin HEAD:lyndon/integrate-connector-keyboard-fix
