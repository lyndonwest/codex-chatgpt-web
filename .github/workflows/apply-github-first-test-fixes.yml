name: Apply GitHub-first test fixes

on:
  push:
    branches: [lyndon/github-first-web-apps]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap GitHub-first test fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lyndon/github-first-web-apps
      - run: python3 scripts/fix-github-first-web-tests.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web tests
          git commit -m "Align Full Harness tests with GitHub-first routing"
          git push origin HEAD:lyndon/github-first-web-apps
