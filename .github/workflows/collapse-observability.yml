name: Collapse observability wrappers

on:
  push:
    branches:
      - lyndon/compaction-observability-backoff

permissions:
  contents: write

jobs:
  collapse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Collapse wrappers and validate
        run: |
          python3 scripts/collapse-observability.py
          git diff --check
          bun run verify
      - name: Commit direct-edit form
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/collapse-observability.py .github/workflows/collapse-observability.yml
          git add src/adapters/chatgpt-web/index.ts src/adapters/chatgpt-web/launcher-helper-client.ts
          git add -u src/adapters/chatgpt-web/index-base.ts src/adapters/chatgpt-web/launcher-helper-client-base.ts
          git commit -m "Collapse observability wrappers into direct edits"
          git push origin HEAD:${GITHUB_REF_NAME}
