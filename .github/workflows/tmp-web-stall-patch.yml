name: Temporary Web stall patch

on:
  push:
    branches:
      - codex/web-stall-diagnostics

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply patch
        run: |
          python3 .github/scripts/tmp_apply_web_stall_patch.py
          python3 .github/scripts/tmp_update_effort_contract.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install launcher dependencies
        run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Focused tests
        run: bun test tests/chatgpt-web-stall-detection.test.ts tests/browser-worker-contract.test.ts
      - name: Full verification
        run: bun run verify
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts tests/chatgpt-web-stall-detection.test.ts
          git commit -m 'Fail stalled Web turns promptly'
          git push
