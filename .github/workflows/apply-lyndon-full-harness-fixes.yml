name: Apply Lyndon Full Harness fixes

on:
  push:
    branches:
      - lyndon/full-harness-fixes

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[applied-local-fixes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply local patch stack
        run: git apply --check .github/lyndon-full-harness.patch && git apply .github/lyndon-full-harness.patch

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if [ -f launcher/bun.lock ] || [ -f launcher/bun.lockb ]; then
            (cd launcher && bun install --frozen-lockfile)
          fi

      - name: Verify project
        run: bun run verify

      - name: Commit verified source changes
        run: |
          rm -f .github/lyndon-full-harness.patch .github/workflows/apply-lyndon-full-harness-fixes.yml
          git config user.name "Lyndon Full Harness CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Full Harness tools and compaction [applied-local-fixes]"
          git push origin HEAD:lyndon/full-harness-fixes
