name: Apply GitHub-first Web app patch

on:
  push:
    branches: [lyndon/github-first-web-apps]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap GitHub-first Web app patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lyndon/github-first-web-apps
      - name: Apply bounded source patch
        run: python3 scripts/apply-github-first-web-apps.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web tests
          git commit -m "Route Web turns through GitHub by default"
          git push origin HEAD:lyndon/github-first-web-apps
