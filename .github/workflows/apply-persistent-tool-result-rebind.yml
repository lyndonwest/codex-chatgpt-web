                  raise SystemExit(f"empty transformed file: {path}")
          PY
          git diff --check

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if [[ -f launcher/bun.lock || -f launcher/bun.lockb ]]; then
            (cd launcher && bun install --frozen-lockfile)
          fi

      - name: Focused regressions
        run: bun test tests/chatgpt-web-harness.test.ts tests/persistent-session.test.ts

      - name: Full verification
